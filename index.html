<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dettati Magici</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <div class="badge">Dettati Magici</div>
        <h1>Leggi, ascolta, riscrivi</h1>
        <p>Carica una foto o un PDF. L app legge lentamente e tu puoi correggere.</p>
      </header>

      <section class="panel">
        <div class="row">
          <label class="field">
            <span>Nome bambino</span>
            <input id="studentName" type="text" placeholder="Es. Luca" />
          </label>
          <button id="saveStudent" class="btn primary">Salva</button>
        </div>
        <div id="progressCard" class="progress"></div>
      </section>

      <section class="panel">
        <div class="row">
          <label class="file-box" for="fileInput">
            <input id="fileInput" type="file" accept="image/*,.pdf" />
            <span>Carica immagine o PDF</span>
          </label>
          <button id="runOcr" class="btn">Fai OCR</button>
        </div>
        <div id="ocrStatus" class="status">Pronto.</div>
      </section>

      <section class="panel">
        <div class="grid">
          <div>
            <h2>Testo letto</h2>
            <textarea id="ocrText" placeholder="Il testo apparira qui"></textarea>
          </div>
          <div>
            <h2>Testo bambino</h2>
            <textarea id="childText" placeholder="Scrivi qui il dettato"></textarea>
          </div>
        </div>
        <div class="controls">
          <div class="slider">
            <label for="rate">Velocita lettura</label>
            <input id="rate" type="range" min="0.6" max="1.2" step="0.1" value="0.8" />
          </div>
          <div class="slider">
            <label for="chunk">Parole per passo</label>
            <input id="chunk" type="range" min="3" max="12" step="1" value="6" />
          </div>
          <button id="play" class="btn primary">Leggi</button>
          <button id="pause" class="btn">Pausa</button>
          <button id="stop" class="btn">Stop</button>
          <button id="saveAttempt" class="btn success">Salva correzione</button>
        </div>
      </section>

      <section class="panel">
        <h2>Storico</h2>
        <div id="history" class="history"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
